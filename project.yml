name: Skinalyze
options:
  bundleIdPrefix: com.Patani
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 4JD2N84N6P
    # App target stays in Swift 5 mode until the legacy views are rewritten (PHASES.md 0.3);
    # SkinalyzeKit already compiles in Swift 6 mode.
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SkinalyzeKit:
    path: SkinalyzeKit
targets:
  Skinalyze:
    type: application
    platform: iOS
    sources: [Skinalyze]
    dependencies:
      - package: SkinalyzeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Patani.Skinalyze
        INFOPLIST_FILE: Skinalyze/Info.plist
        CODE_SIGN_ENTITLEMENTS: Skinalyze/Skinalyze.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1" # iPhone only (incl. iPhone Duo)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SkinalyzeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SkinalyzeTests]
    dependencies:
      - target: Skinalyze
      - package: SkinalyzeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Patani.SkinalyzeTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Skinalyze:
    build:
      targets:
        Skinalyze: all
    test:
      gatherCoverageData: true
      targets:
        - SkinalyzeTests
        - package: SkinalyzeKit/SkinalyzeKitTests
