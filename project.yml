name: Skinalyze
options:
  bundleIdPrefix: com.Patani
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 4JD2N84N6P
    # App target stays in Swift 5 mode until the legacy views are rewritten (PHASES.md 0.3);
    # SkinalyzeKit already compiles in Swift 6 mode.
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SkinalyzeKit:
    path: SkinalyzeKit
targets:
  Skinalyze:
    type: application
    platform: iOS
    sources: [Skinalyze, SharedSources/Catalog, SharedSources/System]
    dependencies:
      - package: SkinalyzeKit
      - target: ProductCheckShare
      - target: SkinalyzeWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Patani.Skinalyze
        INFOPLIST_FILE: Skinalyze/Info.plist
        CODE_SIGN_ENTITLEMENTS: Skinalyze/Skinalyze.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1" # iPhone only (incl. iPhone Duo)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ProductCheckShare:
    type: app-extension
    platform: iOS
    sources:
      - ProductCheckShare
      - SharedSources/Catalog
    dependencies:
      - package: SkinalyzeKit
    info:
      path: ProductCheckShare/Info.plist
      properties:
        CFBundleDisplayName: Skinalyze
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: ProductPage
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ProductCheckShare/ProductCheckShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.Patani.Skinalyze]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Patani.Skinalyze.ProductCheck
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SHARE_EXTENSION
  SkinalyzeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SkinalyzeWidgets
      - SharedSources/System
    dependencies:
      - package: SkinalyzeKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: SkinalyzeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Skinalyze
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SkinalyzeWidgets/SkinalyzeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.Patani.Skinalyze]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Patani.Skinalyze.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
  SkinalyzeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SkinalyzeTests]
    dependencies:
      - target: Skinalyze
      - package: SkinalyzeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Patani.SkinalyzeTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  SkinalyzeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SkinalyzeUITests]
    dependencies:
      - target: Skinalyze
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Patani.SkinalyzeUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Skinalyze
schemes:
  Skinalyze:
    build:
      targets:
        Skinalyze: all
    test:
      gatherCoverageData: true
      targets:
        - SkinalyzeTests
        - package: SkinalyzeKit/SkinalyzeKitTests
        - SkinalyzeUITests
